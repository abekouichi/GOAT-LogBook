[package]
name = "logbook"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = "2"
rfd = "0.15"
printpdf = { version = "0.7", default-features = false }
fontdue = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build = "1.12"
winresource = "0.1"

[profile.release]
lto = true
strip = true
